  /api/announcements/:
    get:
      operationId: announcements_list
      description: |-
        Only Admin creates/edits/deletes announcements. Everyone authenticated
        sees the announcements targeted at their audience (ALL / their role /
        their specific class). Creating an announcement automatically fans out
        an in-app Notification to every user in that audience.
      parameters:
      - in: query
        name: audience
        schema:
          type: string
          enum:
          - ALL
          - CLASS
          - STUDENTS
          - TEACHERS
        description: |-
          * `ALL` - Everyone
          * `STUDENTS` - Students
          * `TEACHERS` - Teachers
          * `CLASS` - Specific Class
      - in: query
        name: class_room
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
