components:
  schemas:
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_by_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        message:
          type: string
        audience:
          $ref: '#/components/schemas/AudienceEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        class_room:
          type: integer
          nullable: true
        created_by:
          type: integer
          readOnly: true
      required:
      - created_at
      - created_by
      - created_by_name
      - id
      - message
      - title
      - updated_at
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        remarks:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        student:
          type: integer
        marked_by:
          type: integer
          nullable: true
      required:
      - created_at
      - date
      - id
      - status
      - student
      - student_name
      - updated_at
    AttendanceStatusEnum:
      enum:
      - PRESENT
      - ABSENT
      - LEAVE
      - HOLIDAY
      type: string
      description: |-
        * `PRESENT` - Present
        * `ABSENT` - Absent
        * `LEAVE` - Leave
        * `HOLIDAY` - Holiday
    AudienceEnum:
      enum:
      - ALL
      - STUDENTS
      - TEACHERS
      - CLASS
      type: string
      description: |-
        * `ALL` - Everyone
        * `STUDENTS` - Students
        * `TEACHERS` - Teachers
        * `CLASS` - Specific Class
    BackupRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        file:
          type: string
          format: uri
          nullable: true
        status:
          $ref: '#/components/schemas/BackupRecordStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        notes:
          type: string
        triggered_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - status
      - triggered_by
    BackupRecordStatusEnum:
      enum:
      - SUCCESS
      - FAILED
      type: string
      description: |-
        * `SUCCESS` - Success
        * `FAILED` - Failed
    CustomTokenObtainPair:
      type: object
      description: Adds role/name claims to the JWT payload so the frontend can route
        by role.
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    DayOfWeekEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    DeliveryStatusEnum:
      enum:
      - PENDING
      - SENT
      - FAILED
      - NOT_CONFIGURED
      type: string
      description: |-
        * `PENDING` - Pending
        * `SENT` - Sent
        * `FAILED` - Failed
        * `NOT_CONFIGURED` - Push Not Configured
    DocumentTypeEnum:
      enum:
      - ID_CARD
      - REPORT_CARD
      - FEE_RECEIPT
      - SALARY_RECEIPT
      - OTHER
      type: string
      description: |-
        * `ID_CARD` - ID Card
        * `REPORT_CARD` - Report Card
        * `FEE_RECEIPT` - Fee Receipt
        * `SALARY_RECEIPT` - Salary Receipt
        * `OTHER` - Other
    Exam:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        exam_subjects:
          type: array
          items:
            $ref: '#/components/schemas/ExamSubject'
          readOnly: true
        name:
          type: string
          maxLength: 150
        exam_type:
          $ref: '#/components/schemas/ExamTypeEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        room:
          type: string
          description: Exam room/hall, if applicable.
          maxLength: 50
        calendar_file:
          type: string
          format: uri
          nullable: true
        school_class:
          type: integer
        session:
          type: integer
      required:
      - end_date
      - exam_subjects
      - exam_type
      - id
      - name
      - school_class
      - session
      - start_date
    ExamSubject:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subject_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          nullable: true
        max_marks:
          type: integer
          maximum: 2147483647
          minimum: 0
        passing_marks:
          type: integer
          maximum: 2147483647
          minimum: 0
        exam:
          type: integer
        subject:
          type: integer
      required:
