  /api/announcements/notifications/:
    get:
      operationId: announcements_notifications_list
      description: |-
        Each user (Admin, Teacher, Student) sees only notifications addressed
        to them. Notifications are created by the system (announcement
        fan-out), not directly by API clients -- so `create` isn't offered here;
        users may only read their own list and mark items as read.
      parameters:
      - in: query
        name: is_read
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
