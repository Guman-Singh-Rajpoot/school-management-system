services:
  # Backend API Service
  - type: web
    name: school-management-backend
    env: python
    plan: free
    region: oregon
    buildCommand: |
      cd backend && 
      pip install -r requirements.txt && 
      python manage.py migrate && 
      python manage.py collectstatic --noinput
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        scope: project
        value: school-management-backend.onrender.com,*.onrender.com,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        scope: project
        value: https://school-management-frontend.onrender.com,https://*.onrender.com
      - key: DATABASE_URL
        scope: project
        # Set this to your Render PostgreSQL connection string
        # Format: postgresql://username:password@hostname:5432/dbname
      - key: DB_NAME
        value: school_management
      - key: DB_USER
        scope: project
      - key: DB_PASSWORD
        scope: project
      - key: DB_HOST
        scope: project
      - key: DB_PORT
        value: "5432"

  # Frontend Service
  - type: static-site
    name: school-management-frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: VITE_API_URL
        scope: project
        value: https://school-management-backend.onrender.com
